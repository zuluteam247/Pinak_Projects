name: CI/CD Pipeline

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pinak_Services/memory_service
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libopenblas-dev liblapack-dev gfortran build-essential libomp-dev jq
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --project Pinak_Services/memory_service --extra tests
    - name: Run tests
      run: |
        uv run --project Pinak_Services/memory_service pytest tests/ -v --tb=short
    - name: Lint with flake8
      run: |
        uv run --project Pinak_Services/memory_service flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run --project Pinak_Services/memory_service flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build Docker image
      run: |
        docker build -f Pinak_Services/memory_service/Dockerfile -t pinak-memory-service .
    - name: Run container
      run: |
        docker run -d --rm --name test-container -e PINAK_JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" pinak-memory-service
        for attempt in $(seq 1 30); do
          if docker exec test-container python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"; then
            docker stop test-container
            exit 0
          fi
          sleep 2
        done
        docker logs test-container
        exit 1

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  audit:
   runs-on: ubuntu-latest
   steps:
   - uses: actions/checkout@v4
   - name: Set up Python
     uses: actions/setup-python@v5
     with:
       python-version: '3.12'
   - name: Install uv
     uses: astral-sh/setup-uv@v5
   - name: Install pip-audit
     run: python -m pip install pip-audit
   - name: Audit locked project dependencies
     run: |
       uv export --project Pinak_Services/memory_service --frozen --no-dev --format requirements.txt --no-emit-project --no-emit-workspace --no-hashes --output-file /tmp/pinak-requirements.txt
       pip-audit --no-deps -r /tmp/pinak-requirements.txt
