name: One-time memory service restore
on:
  workflow_dispatch:
jobs:
  restore:
    if: github.ref == 'refs/heads/main' && github.repository == 'zuluteam247/Pinak_Projects'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore only malformed source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4dc92683de91d931a6e98291258982535fe9e9e5 HEAD
          echo 'be71f9092c5ebc2cb96caca1658b19719233026dc72aebd856e281317baaf9b4  Pinak_Services/memory_service/app/services/memory_service.py' | sha256sum -c -
          git show 26d9fbb1ead171f2f56b4d0ef66bb2832c7777cd:Pinak_Services/memory_service/app/services/memory_service.py > Pinak_Services/memory_service/app/services/memory_service.py
          echo '58e03b535b75d0fff61947c2bc6c62cc213a7404e1dca8e61a26507471059c5d  Pinak_Services/memory_service/app/services/memory_service.py' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Pinak_Services/memory_service/app/services/memory_service.py
          test "$(git diff --cached --name-only)" = 'Pinak_Services/memory_service/app/services/memory_service.py'
          git commit -m 'Restore memory service after malformed editor commit'
          git push origin HEAD:main
