name: One-time memory ID verification patch
on:
  workflow_dispatch:
jobs:
  patch:
    if: github.ref == 'refs/heads/main' && github.repository == 'zuluteam247/Pinak_Projects'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.4'
      - name: Apply hash-gated narrow source patch
        run: |
          set -euo pipefail
          echo '58e03b535b75d0fff61947c2bc6c62cc213a7404e1dca8e61a26507471059c5d  Pinak_Services/memory_service/app/services/memory_service.py' | sha256sum -c -
          printf '%s' '' | base64 -d > /tmp/memory-id.patch
          echo '8c6906c3ad4a214c6a31476e3c61176686b2c111327a4992e063dc6f2e56a833  /tmp/memory-id.patch' | sha256sum -c -
          git apply --check /tmp/memory-id.patch
          git apply /tmp/memory-id.patch
          echo 'dcfafcd05b8dfca0825f98c4f30dde7bb24e5f21642428dca8a1e95314be247a  Pinak_Services/memory_service/app/services/memory_service.py' | sha256sum -c -
          test "$(git diff --name-only)" = 'Pinak_Services/memory_service/app/services/memory_service.py'
      - name: Install and run full service tests
        run: |
          set -euo pipefail
          uv sync --project Pinak_Services/memory_service --extra tests --frozen
          uv run --project Pinak_Services/memory_service --extra tests --frozen pytest Pinak_Services/memory_service/tests/ -q --tb=short
      - name: Audit base dependencies
        run: |
          set -euo pipefail
          python -m pip install pip-audit
          uv export --project Pinak_Services/memory_service --frozen --no-dev --format requirements.txt --no-emit-project --no-emit-workspace --no-hashes --output-file /tmp/pinak-requirements.txt
          pip-audit --no-deps -r /tmp/pinak-requirements.txt
      - name: Commit only verified source
        run: |
          set -euo pipefail
          echo 'dcfafcd05b8dfca0825f98c4f30dde7bb24e5f21642428dca8a1e95314be247a  Pinak_Services/memory_service/app/services/memory_service.py' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Pinak_Services/memory_service/app/services/memory_service.py
          test "$(git diff --cached --name-only)" = 'Pinak_Services/memory_service/app/services/memory_service.py'
          git commit -m 'Verify vector embedding IDs during startup'
          git push origin HEAD:main
