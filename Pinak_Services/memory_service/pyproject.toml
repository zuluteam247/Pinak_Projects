[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinak-memory-service"
version = "0.1.0"
description = "Enterprise-grade Pinak memory service for autonomous agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "PyJWT>=2.8",
    "jsonschema>=4.22.0",
    "textual>=0.47.1",
    "typer>=0.9.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
tests = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.26.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "flake8>=7.0.0",
    "pytest-cov>=4.1.0",
    "mutmut>=2.4.4",
    "hypothesis>=6.100.0",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["app"]

