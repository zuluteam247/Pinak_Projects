services:
  memory-api:
    build:
      context: ..
      dockerfile: Pinak_Services/memory_service/Dockerfile
    # One process owns each local data directory. Do not scale this service against
    # the same volume; network filesystems are unsupported for SQLite and flock.
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./memory_service/data:/code/Pinak_Services/memory_service/data
    environment:
      PINAK_JWT_SECRET: ${PINAK_JWT_SECRET:?Set a non-default PINAK_JWT_SECRET in your environment}
      PINAK_EMBEDDING_BACKEND: none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
